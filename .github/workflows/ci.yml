name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: windows · live selftest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o shiptop.exe .
      - name: read real system data and verify it
        run: .\shiptop.exe --selftest
      - name: list real windows and bring a minimized one to the front
        shell: pwsh
        run: |
          Add-Type -Namespace W -Name U -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
          [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
          '@
          Set-Content alpha.txt "alpha"; Set-Content beta.txt "beta"
          $a = Start-Process notepad -ArgumentList alpha.txt -PassThru
          Start-Sleep -Seconds 3
          $b = Start-Process notepad -ArgumentList beta.txt -PassThru
          Start-Sleep -Seconds 3
          $a.Refresh(); $b.Refresh()
          [W.U]::ShowWindow($a.MainWindowHandle, 6) | Out-Null   # SW_MINIMIZE
          Start-Sleep -Seconds 1
          "foreground before: $([W.U]::GetForegroundWindow()) · alpha $($a.MainWindowHandle) minimized=$([W.U]::IsIconic($a.MainWindowHandle)) · beta $($b.MainWindowHandle)"
          $list = .\shiptop.exe --windows
          $list
          if (-not ($list -match 'alpha.txt - Notepad.*\(minimized\)')) { throw "alpha should be listed as minimized" }
          if (-not ($list -match 'beta.txt - Notepad')) { throw "beta is missing from the window list" }
          .\shiptop.exe --raise alpha.txt
          if ($LASTEXITCODE -ne 0) { throw "--raise failed" }
          Start-Sleep -Milliseconds 500
          $fg = [W.U]::GetForegroundWindow()
          "foreground after: $fg · alpha minimized=$([W.U]::IsIconic($a.MainWindowHandle))"
          if ($fg -ne $a.MainWindowHandle) { throw "alpha is not the foreground window" }
          if ([W.U]::IsIconic($a.MainWindowHandle)) { throw "alpha is still minimized" }
          Stop-Process -Id $a.Id, $b.Id -ErrorAction SilentlyContinue

  linux:
    name: linux · live selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o shiptop .
      - run: ./shiptop --selftest

  layouts:
    name: windows struct layouts vs SDK headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: |
          for f in tools/wincheck/*.c; do
            x86_64-w64-mingw32-gcc -std=c11 -c "$f" -o /dev/null
          done
          echo "all layout asserts hold"

  cross:
    name: cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go vet ./...
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null .
          done
