name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - run: go build -o shiptop.exe .
      - run: .\shiptop.exe --selftest

  release:
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - name: build
        run: |
          mkdir dist
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/shiptop-${os}-${arch}${ext}" .
          done
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "shiptop $GITHUB_REF_NAME" --generate-notes
